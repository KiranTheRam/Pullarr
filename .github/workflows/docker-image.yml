name: Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: pullarr
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  docker:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve application version
        id: version
        shell: sh
        run: |
          BUILD_VERSION="$(sed 's/+local$//' backend/VERSION)+g${GITHUB_SHA}"
          case "${GITHUB_REF}" in
            refs/heads/main)
              # Each new workflow run advances the installed patch version.
              BASE_VERSION="$(sed 's/+local$//' backend/VERSION)"
              PATCH="${BASE_VERSION##*.}"
              BUILD_VERSION="${BASE_VERSION%.*}.$((PATCH + GITHUB_RUN_NUMBER))+g${GITHUB_SHA}"
              ;;
            refs/tags/*)
              BUILD_VERSION="${GITHUB_REF#refs/tags/}"
              BUILD_VERSION="${BUILD_VERSION#v}"
              ;;
          esac
          printf 'version=%s\n' "$BUILD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            PULLARR_BUILD_VERSION=${{ steps.version.outputs.version }}
            PULLARR_BUILD_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker Hub secrets missing
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        run: echo "Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish Docker images."
